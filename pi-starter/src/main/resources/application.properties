quarkus.application.name=pi-starter
# The human-readable application name, shown in the UI (drawer, share text, ...).
# Change it here instead of hunting through the code; the build-time PWA name is in AppShell.
starter.app.name=Pi Starter
# Requires an explicitly configured host and appropriate sudo permissions.
starter.power-actions.enabled=true

# The Proto Tools screens from pi-helpers (GPIO, I2C, PWM, 1-Wire, Bluetooth LE) for
# checking wiring before writing code; switch off in a finished application.
starter.proto-tools.enabled=true

# Device access is the production default. Development and browserless tests
# replace device-facing CDI services with alternatives from src/simulation/java.

# Settings changed from the UI (e.g. the Home Assistant connection) are kept here.
starter.data-dir=data

# Optional passwordless sign-in with passkeys (WebAuthn). Off by default: the app
# then behaves exactly as without authentication. Turn it on and the first person
# to sign in enrolls the administrator passkey; admins invite others from Users.
# Passkeys require HTTPS (see HTTPS.md); localhost is exempt for development.
starter.auth.enabled=false
# One JSON file per user/passkey, alongside the other settings; no database.
starter.users-dir=${user.home}/.pipwa/users
quarkus.webauthn.relying-party.name=Pi Starter
# In production set the relying-party id and origin to your HTTPS host:
#quarkus.webauthn.relying-party.id=pi.example.org
#quarkus.webauthn.origins=https://pi.example.org
# Login is verified through the extension's built-in endpoint; registration goes
# through our own invite-gated endpoint, so the built-in one stays disabled.
quarkus.webauthn.enable-login-endpoint=true
quarkus.webauthn.enable-registration-endpoint=false
# A finished application configures its MQTT broker here instead of from the UI;
# setting starter.mqtt.host makes the Climate view read-only about it.
#starter.mqtt.host=homeassistant.local
#starter.mqtt.port=1883
#starter.mqtt.username=
#starter.mqtt.password=
#starter.mqtt.device-id=pi-kitchen
#starter.mqtt.topic-prefix=pi-starter
#starter.mqtt.interval=30
#starter.mqtt.enabled=true
%test.starter.data-dir=target/test-data
# Keep passkey data out of the developer's home directory during tests.
%test.starter.users-dir=target/test-users
# Tests must not depend on what happens to be on the network.
%test.starter.mdns.enabled=false
